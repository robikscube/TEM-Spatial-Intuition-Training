[project]
name = "tem-container-runtime"
version = "0.1.0"
requires-python = ">=3.13.15,<3.14"
dependencies = [
    "numpy==2.5.2",
    "scipy==1.18.1",
]

[project.optional-dependencies]
cpu = [
    "torch==2.8.0+cpu",
]
cuda = [
    "torch==2.8.0+cu129",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "torch-cpu", extra = "cpu" },
    { index = "torch-cu129", extra = "cuda" },
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
